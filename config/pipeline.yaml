# Configuration unique du pipeline de comptage de personnes (spec section 2).
#
# Toute valeur métier vit ici : aucun paramètre fonctionnel ne doit être codé en
# dur dans src/main.py ou ailleurs. Chaque exécution écrit une copie résolue de
# ce fichier dans results/{session_id}/config_resolved.yaml.
#
# Les valeurs marquées « PROVISOIRE » ne sont pas encore calibrées : elles
# devront être fixées sur l'ensemble de calibration (spec section 9.1) et ne
# jamais être ajustées sur l'ensemble de test.

schema_version: 1

source:
  # Source par défaut : "0" (index caméra) ou un chemin de fichier vidéo.
  # Peut être surchargée par --source. --config peut pointer vers un autre YAML.
  default: "0"
  # Nombre de tentatives de reconnexion quand le flux s'ouvre mais ne produit
  # plus d'images (spec 5.5). 0 = fin de flux considérée comme une erreur.
  reconnect_attempts: 0
  # Durée sans aucune détection au-delà de laquelle l'absence est signalée
  # (SOURCE_NO_DETECTION), distincte d'une fin de flux et d'une erreur.
  no_detection_seconds: 2.0

model:
  path: models/yolo11n.pt
  expected_sha256: "0ebbc80d4a7680d14987a577cd21342b65ecfd94632bd9a8da63ae6417644ee1"
  # Seuil d'inférence YOLO. Volontairement BAS : une personne légèrement floue
  # produit des scores faibles mais des boîtes encore exploitables par
  # l'association BoT-SORT. Filtrer ces détections ici les supprime avant même
  # que le tracker puisse s'en servir, ce qui casse la persistance de piste.
  # Le garde-fou contre les faux positifs était porté par new_track_thresh (0,7) ;
  # depuis le lot 4 (0,45), il l'est par le filtre géométrique et
  # timing.confirmation_seconds — voir la section tracker.
  confidence: 0.10          # PROVISOIRE — à calibrer sur l'ensemble de calibration (9.4)
  # nms_iou — CONSERVÉ à 0,55 après mesure (lot 1, §1.2). Le lot proposait de
  # le monter à 0,85 ou 0,90, pour récupérer les détections de personnes
  # assises côte à côte qu'on supposait supprimées par la NMS. Mesuré sur
  # fort_occ4, chaque valeur isolément, en base de temps vidéo :
  #   0,55 -> 21 identifiants techniques, 18 identités, 6 changements d'ID
  #   0,85 -> 35 identifiants techniques, 22 identités, 14 changements d'ID
  #   0,90 -> 65 identifiants techniques, 45 identités, 21 changements d'ID,
  #           et occupancy_operational = 16 pour 13 personnes réelles
  # erreur_comptage_max_visible vaut 9 dans les TROIS cas : les personnes
  # manquantes ne manquent pas par suppression NMS. Monter le seuil ne fait
  # que créer des doublons promus en identités. Voir docs/correctif_occlusion.md
  # §14.6. Reste PROVISOIRE : non calibré sur un corpus disjoint.
  nms_iou: 0.55             # PROVISOIRE — 0,85 et 0,90 mesurés et écartés (§14.6)
  image_size: 960           # PROVISOIRE — à calibrer
  classes: [0]              # classe COCO « person »
  device: cpu               # « cpu » (machine de référence) | « auto » | « cuda:0 »

tracker:
  config_path: src/configs/custom_botsort.yaml
  persist: true
  # Seuils BoT-SORT, DISTINCTS du seuil YOLO et synchronisés avec le YAML lu par
  # Ultralytics (un test vérifie la synchronisation, sinon la divergence serait
  # silencieuse).
  track_high_thresh: 0.4    # plancher de l'association principale
  track_low_thresh: 0.1     # plancher du second étage (détections faibles)
  # new_track_thresh — MODIFIÉ au lot 4 (docs/correctif_occlusion.md §15).
  #   valeur précédente : 0.7.
  #   raison : seul des trois seuils de la fiche à déplacer visible_count sur
  #     fort_occ4 (base vidéo, bruit nul) : erreur_comptage_max_visible 9 -> 7,
  #     somme des écarts visibles sur 35 s 143 -> 77, pistes_vues min 2 -> 3,
  #     4-5 -> 10-12 pistes visibles de s29 à s34 pour 10-11 personnes
  #     visibles annotées (9-10 même après retrait des boîtes incluses dans une
  #     autre). Une personne assise partiellement masquée sort à 0,35-0,6 : à
  #     0,7 elle ne recréait jamais de piste.
  #   compromis accepté : sur-création d'identités. fort_occ4 : persons_created
  #     18 -> 38, pistes surnuméraires 6 -> 11. rare_occ2 : persons_created
  #     7 -> 12, jusqu'à 2 pistes visibles en double (boîte « haut du corps »
  #     emboîtée dans la boîte entière de la même personne), une personne
  #     réellement manquée récupérée. LE CRITÈRE DE NON-RÉGRESSION DU §4 N'EST
  #     PAS TENU sur rare_occ2 : valeur soumise à acceptation.
  #   garde-fou contre les faux positifs, auparavant porté par 0.7 : reporté sur
  #     le filtre géométrique (geometry.min/max_aspect_ratio_wh,
  #     min_box_height_px, min_box_width_px) et sur timing.confirmation_seconds
  #     (0,5 s de présence avant tout franchissement). MESURÉ INEFFICACE contre
  #     les doublons observés : une boîte haut du corps a un ratio plausible et
  #     une présence continue ; aucun rejet géométrique sur les deux vidéos.
  #   interaction NMS (fiche §A.5) : mesurée avec nms_iou 0,55, la valeur en
  #     vigueur — le relèvement du lot 1.2 a été écarté, il n'y a pas de seuil
  #     NMS relevé avec lequel combiner.
  #   PROVISOIRE : calibré sur l'ensemble de test lui-même, pas sur un corpus
  #     disjoint.
  new_track_thresh: 0.45    # plancher exigé pour créer une NOUVELLE piste
  # -- Lot 4 : mesure isolée des trois seuils (docs/correctif_occlusion.md §15)
  # Base vidéo, fort_occ4 + rare_occ2, ligne de convention figée. Résultat :
  #   match_thresh 0,9 -> 0,75 : ÉCARTÉ. Aucun gain visible (erreur visible 9),
  #     pistes surnuméraires 6 -> 13, TECHNICAL_ID_CHANGED 6 -> 14.
  #   proximity_thresh 0,5 -> 0,8 : NON APPLIQUÉ. Seul : visible_count
  #     inchangé (9), fragmentation réduite (surnuméraires 6 -> 4) ; combiné à
  #     new_track_thresh 0,45 : erreur visible 7 -> 6 mais surnuméraires
  #     11 -> 13. Effet mitigé, consultation d'un descripteur peu
  #     discriminant : À REPRENDRE APRÈS LE LOT 3 (OSNet).
  #   new_track_thresh 0,7 -> 0,45 : appliqué, voir ci-dessus.
  # -- Historique : mesure antérieure, NON REJOUABLE ------------------------
  # (Le paragraphe suivant date d'avant le lot 0 ; sa vidéo n'existe plus.)
  # Le correctif « occlusion dense » proposait match_thresh 0,9 -> 0,75,
  # proximity_thresh 0,5 -> 0,8 et new_track_thresh 0,7 -> 0,45 (justification :
  # match_thresh est un seuil de COÛT, `linear_assignment(dists, thresh=...)`
  # avec dists = 1 - IoU, donc 0,9 accepte un appariement à IoU 0,1 ; et
  # proximity_thresh neutralise le ReID natif exactement quand la personne
  # ressort d'une occlusion). La mesure isolée de chaque seuil a été refaite
  # (scripts/measure_tracker_swaps.py, 300 frames de
  # test/5121204_School_Classroom_1280x720.mp4, un seuil à la fois puis les
  # trois ensemble) ; résultat « identifiants techniques créés / changements
  # d'identifiant », l'objectif étant de MINIMISER les deux :
  #   0,9 / 0,5 / 0,7 (production)   -> 11 / 4
  #   match_thresh 0,75 seul         -> 12 / 5   (dégradation)
  #   proximity_thresh 0,8 seul      -> 11 / 4   (aucun effet mesurable)
  #   new_track_thresh 0,45 seul     -> 13 / 4   (+2 identités créées)
  #   les trois ensemble             -> 15 / 8   (dégradation nette)
  # Aucun des trois n'est retenu : le seul effet net mesuré est défavorable à la
  # stabilité d'identité, et le correctif groupé qui les avait appliqués a été
  # annulé pour cette raison (git d4915b5). Le compromis de new_track_thresh
  # 0,45 est réel — il autorise une personne partiellement masquée à recréer une
  # piste (symptôme 2, new_track_thresh 0,7 l'en empêche) — mais il crée 2
  # identités supplémentaires sur 12 s sans réduire les changements
  # d'identifiant : il reste PROVISOIRE et NON appliqué, faute d'un corpus
  # annoté où l'on peut vérifier qu'une réapparition réelle devient la même
  # personne. Voir docs/correctif_occlusion.md pour le tableau complet.

  # -- Persistance de piste et ré-identification native -------------------
  # track_buffer : nombre de frames pendant lesquelles une piste perdue reste
  # vivante côté tracker. Valeur réglée sur les occlusions RÉELLEMENT mesurées
  # dans results/*/events.jsonl (OCCLUDED -> réapparition) : médiane 2,5 s,
  # p90 5,1 s, maximum 13,5 s à la cadence source (~30 ips). 150 frames couvrent
  # le p90 (~5 s) ; au-delà, la galerie ReID long terme (section reid) prend le
  # relais. Compromis : plus long = moins de changements d'identifiant technique,
  # mais plus de mémoire/calcul et un risque légèrement accru de réassociation
  # erronée en forte densité de personnes d'apparence similaire.
  # track_buffer_seconds — NOUVEAU (lot 1, §1.1). Valeur précédente : aucune
  # (seul `track_buffer`, en FRAMES, existait).
  #   raison : `track_buffer` en frames ne couvre pas la même durée selon la
  #     source (150 frames = 5 s sur fichier à 30 ips, ~43 s sur caméra à 3,5 ips
  #     traités), alors que la galerie ReID raisonne en secondes. L'horizon du
  #     tracker devenait une propriété de la machine, pas de la scène.
  #   valeur 15,0 s : le diagnostic mesure des occlusions jusqu'à 13,5 s ; 12,0 s
  #     ne les couvrirait pas toutes, 15,0 s laisse une marge.
  #   compromis accepté : un horizon plus long garde des pistes mortes plus
  #     longtemps — plus de mémoire, et risque accru de réassociation erronée en
  #     forte densité.
  #   PROVISOIRE : à figer quand la plus longue occlusion du corpus aura été
  #     mesurée en base de temps vidéo (lot 1, §1.4).
  track_buffer_seconds: 15.0
  # Frames de mesure du FPS avant conversion, quand le FPS n'est pas connu
  # d'avance (source caméra). Sur fichier, la cadence source est lue
  # directement et la conversion est faite avant le premier appel au tracker.
  fps_warm_up_frames: 60
  # track_buffer : valeur DÉDUITE au démarrage de track_buffer_seconds. Celle
  # écrite ici ne sert que de repli si track_buffer_seconds vaut null.
  track_buffer: 150   # EN FRAMES — déduit au démarrage, voir ci-dessus
  # -- Incohérence de base de temps (documentée, PAS corrigée) --------------
  # `track_buffer` ci-dessus est en FRAMES, alors que la galerie ReID de la
  # section `reid` est en SECONDES : les deux mécanismes de mémoire ne couvrent
  # donc pas la même durée selon la source. Sur fichier vidéo à 30 ips, 150
  # frames ≈ 5 s de contenu ; sur caméra live à ~3,5 FPS traités, 150 frames
  # ≈ 43 s de temps réel — bien plus que la fenêtre de galerie
  # (grâce 5 s + rétention 12 s = 17 s). Aucune conversion automatique n'est
  # appliquée : elle supposerait un FPS connu à l'avance, ce que
  # `timing.fps_source: measured` interdit. Un avertissement est émis au
  # démarrage quand la source est une caméra live (src/main.py), une fois le FPS
  # réellement mesuré, pour que la divergence soit visible dans le journal
  # plutôt que découverte après coup dans les mesures.
  # with_reid : module d'apparence de BoT-SORT. Il tente une réassociation AVANT
  # de créer un nouvel identifiant technique, en complément du ReID long terme
  # de IdentityManager (qui, lui, opère après expiration de la piste technique).
  with_reid: true
  match_thresh: 0.9         # seuil d'association IoU principal
  proximity_thresh: 0.5     # seuil de proximité du ReID natif
  appearance_thresh: 0.25   # seuil d'apparence du ReID natif
  # Caméra FIXE : aucune compensation de mouvement ne doit être estimée (une GMC
  # active introduirait une instabilité de boîte et d'identifiant sans cause).
  gmc_method: none

reid:
  # Niveau 1 : ReID natif BoT-SORT (réassociation intra-buffer), activé par
  # `with_reid: true` dans la configuration du tracker. Aucune logique
  # supplémentaire n'est nécessaire (spec 3.2).
  short_term: native_botsort
  # Niveau 2 : galerie de personnes pour la réassociation après expiration de
  # la piste technique (spec 3.3). Désactivable pour la baseline 1 (spec 9.4).
  long_term:
    enabled: true
    # PROVISOIRE — à calibrer. Valeur NON modifiée (0,40) : la mesure faite au
    # lot B.4 (scripts/measure_descriptor_similarity.py, 300 frames de
    # test/5121204_School_Classroom_1280x720.mp4, 762 paires intra / 1019 paires
    # inter) montre que le nouveau descripteur par bandes sépare désormais les
    # distributions — p95 inter 0,608 contre p5 intra 0,911 — là où l'ancien
    # descripteur les faisait se recouvrir (p95 inter 0,840). À 0,40, ~25 % des
    # paires INTER-personnes passent encore le seuil (p75 inter = 0,420).
    # Valeur proposée : 0,65, soit juste au-dessus du p95 inter (0,608) tout en
    # restant très en dessous du p5 intra (0,911). Elle n'est PAS appliquée ici :
    # elle doit être calibrée sur un ensemble DISJOINT de l'ensemble de test
    # avant d'être figée (spec 9.1). Voir docs/correctif_occlusion.md §B.4.
    similarity_threshold: 0.40   # PROVISOIRE — proposition 0,65, non appliquée
    safety_margin: 0.10          # PROVISOIRE — écart minimal au second candidat
    v_max_ratio: 1.5             # hauteurs de bbox / seconde
    spatial_margin_ratio: 0.3    # tolérance additionnelle (fraction de hauteur)
    ambiguous_policy: provisional_person  # provisional_person | defer
    # Qualité exigée pour qu'une apparence soit écrite dans la galerie. Une
    # détection faible, un crop minuscule, une boîte tronquée ou une image floue
    # produisent un descripteur qui ne doit JAMAIS remplacer une apparence
    # connue : le rejet est journalisé (REID_DESCRIPTOR_REJECTED).
    gallery_min_confidence: 0.70
    gallery_min_crop_height_px: 32
    gallery_min_crop_width_px: 16
    gallery_min_sharpness: 0.0   # variance du Laplacien ; 0 = contrôle désactivé
    # Rétention de la galerie d'apparence APRÈS purge de l'identité.
    # 12,0 s — ÉTAIT `null` (= alignée sur grace_period_seconds = 5,0 s), donc
    # fenêtre totale passée de grâce + grâce = 10 s à grâce + 12 = 17 s.
    # Raison : `within_gallery_window` (src/identity_manager.py) donne une
    # fenêtre totale `grace_period_seconds + purge_retention_seconds` ; avec
    # `null` elle valait 10 s. Or les occultations mesurées sur les sessions
    # réelles montent à 13,5 s (rapport final §4.6) : les occultations longues
    # — précisément celles qui posent problème — sortaient de mémoire par
    # construction. Compromis accepté : une identité purgée reste ré-associable
    # plus longtemps, au prix d'un risque accru de réassociation erronée si une
    # personne différente, d'apparence proche, réapparaît dans la même zone dans
    # les 17 s. Le garde-fou reste `similarity_threshold` + `safety_margin`,
    # inchangés, et la purge du person_id continue d'être journalisée
    # explicitement.
    gallery_retention_seconds: 12.0
    # Tolérance progressive du seuil d'apparence selon la durée d'absence (une
    # longue occultation change un peu l'apparence : angle, luminosité). Le seuil
    # descend linéairement de similarity_threshold vers ce plancher au bout de
    # long_absence_seconds. null = aucun assouplissement (défaut) : le compromis
    # est choisi explicitement pour ne pas provoquer de fausses réassociations.
    long_absence_seconds: 2.0
    long_absence_similarity_floor: null
    # Momentum de la moyenne glissante du descripteur de galerie (`_blend`).
    # ÉTAIT codé en dur à 0,85 dans le constructeur de IdentityManager, donc
    # invisible et non réglable. Valeur inchangée (0,85) : élevée, elle garde une
    # référence stable face au bruit de détection. Compromis : elle dérive vite
    # vers l'autre personne après un swap NON détecté — c'est précisément ce que
    # corrige le gel du descripteur ci-dessous (appearance_continuity), qui est
    # la vraie protection ; le momentum reste PROVISOIRE, borné à [0, 1[.
    feature_momentum: 0.85
    # Paramètres du descripteur d'apparence léger (HSV). Le descripteur
    # historique (histogramme H×S sur le crop COMPLET) encodait surtout la
    # couleur des chaises, tables et du mur : deux personnes de la même rangée
    # atteignaient une similarité > 0,9 alors que similarity_threshold vaut 0,40.
    descriptor:
      # Fraction rognée de CHAQUE côté en largeur (0,15 = 15 %) : c'est le bord
      # de la boîte qui avale le fond et les voisins. Compromis : un rognage plus
      # fort écarte mieux le fond mais ampute aussi les épaules, donc le
      # vêtement — la seule information réellement propre à la personne.
      horizontal_crop_ratio: 0.15
      # 3 bandes : tête / torse / bas. Chaque bande a son propre histogramme,
      # normalisé séparément, sinon une bande très colorée écraserait les autres.
      bands: 3
      # Poids par bande, de la plus haute à la plus basse. La bande basse est
      # pondérée à 0,5 : elle est la plus souvent occultée par une table ou une
      # chaise, donc la moins informative en salle de cours.
      band_weights: [1.0, 1.0, 0.5]
      bins_hue: 24
      bins_saturation: 8
  # Extracteur d'apparence profond (MobileNetV3 / OSNet). Expérience d'ablation
  # uniquement : si false, le descripteur léger HSV est utilisé.
  external_reid:
    enabled: false
    model_path: osnet_x0_25_msmt17.pt
    weights: osnet_x0_25
    image_size: [256, 128]

  # -- Garde-fou « inversement d'identifiant » (swap) ----------------------
  # Un swap n'est PAS une perte de piste : deux identifiants BoT-SORT restent
  # actifs en continu mais échangent la personne qu'ils suivent. Il se produit à
  # l'intérieur du matching du tracker, donc ni TECHNICAL_ID_CHANGED ni
  # TRACK_ID_ABSENT ne le signalent. Ce garde-fou le mesure : sur une piste qui
  # n'a jamais été perdue, une chute brutale de similarité d'apparence d'une
  # frame à l'autre est journalisée en TRACK_ID_APPEARANCE_DISCONTINUITY.
  # Aucune correction automatique : réaffecter les identités sur un faux positif
  # serait pire que le swap lui-même.
  appearance_continuity:
    enabled: true
    # PROVISOIRE — à calibrer sur l'ensemble de calibration (9.4) : trop élevé
    # multiplie les diagnostics (faux positifs), trop bas ne voit que les
    # échanges francs.
    similarity_threshold: 0.50
    # Écart maximal (frames traitées) pour qu'une piste reste « continue ».
    # Au-delà, la piste a réellement été perdue : c'est le chemin de
    # réassociation normal, pas un swap.
    max_gap_frames: 2
    # Limitation de débit par piste : une discontinuité n'est écrite qu'une fois
    # tant que la continuité n'est pas rétablie, et au plus une fois par
    # intervalle.
    min_interval_seconds: 1.0
    # Nombre de frames pendant lesquelles le descripteur de galerie de
    # l'identité est GELÉ après une discontinuité d'apparence sur sa piste.
    # Sans ce gel, `_touch` mélangeait à chaque frame l'apparence courante dans
    # `record.feature` : au bout de 5 frames (≈ 1,4 s au FPS mesuré de 3,5) la
    # référence contenait 1 − 0,85⁵ ≈ 56 % de l'apparence de l'AUTRE personne,
    # donc `_correct_cross_swaps` devenait aveugle exactement quand le swap
    # s'installait. 3 frames = équivalent de min_interval_seconds (1,0 s) au FPS
    # de traitement mesuré ; borne minimale 3, imposée par la validation.
    freeze_gallery_frames: 3

  # -- Correction active des inversions d'identité (swap) ------------------
  # Réintroduit le comportement [RE-ID-LOCK] de l'ancien IDManager : compare
  # l'apparence directe vs croisée entre paires de pistes connues et corrige
  # le mapping si le croisement dépasse la marge.
  swap_correction:
    enabled: true              # PROVISOIRE — comparer avec/sans sur les vidéos de test
    margin: 0.12               # même valeur que l'ancien [RE-ID-LOCK], à recalibrer

# Ligne virtuelle : les deux points ne sont PAS configurables. Ils sont
# obligatoirement définis par l'opérateur au démarrage (première image affichée,
# deux clics, « C » pour confirmer, « G » pour recommencer, « Échap » pour
# annuler, « I » pour inverser intérieur/extérieur). Aucune ligne par défaut
# n'est utilisée : sans validation explicite, le comptage ne démarre pas.
line:
  inside_side: negative     # orientation INITIALE proposée dans la fenêtre (positive|negative)
  on_line_policy: indeterminate  # jamais « inside » par défaut
  min_length_ratio: 0.05    # rejet d'une ligne dégénérée ou trop courte (5.7)

geometry:
  # Toutes les marges sont RELATIVES à l'échelle locale (hauteur médiane des
  # bbox observées) : jamais de pixels absolus (règle 0.3).
  dead_zone_ratio: 0.15         # PROVISOIRE — fraction de la hauteur médiane
  anchor_edge_margin_ratio: 0.02 # PROVISOIRE — marge de rejet au bord image
  scale_window: 61              # nombre de hauteurs de bbox de l'échelle locale
  # Rayon (fraction de la hauteur médiane) dans lequel une apparition intérieure
  # peut être confondue avec une personne déjà comptée dont l'observation est
  # perdue : NEW est alors différé, jamais confirmé.
  occlusion_ambiguity_ratio: 0.5
  # Filtre géométrique : élimine les faux positifs tout en acceptant les personnes assises
  # Lot 4 : porte désormais le garde-fou contre les faux positifs qu'assurait
  # tracker.new_track_thresh 0,7 (abaissé à 0,45). Valeurs inchangées : ce report
  # est documenté, pas calibré, et il n'arrête pas les boîtes « haut du corps »
  # emboîtées observées au lot 4 (docs/correctif_occlusion.md §15).
  min_aspect_ratio_wh: 0.1       # ratio W/H minimum (rejet des artefacts verticaux)
  max_aspect_ratio_wh: 2.5       # ratio W/H maximum plausible (personne assise tolérée)
  min_box_height_px: 10.0        # hauteur minimale de bounding box
  min_box_width_px: 10.0         # largeur minimale de bounding box
  multi_person_box:
    enabled: true
    max_growth_ratio: 1.6      # PROVISOIRE — à calibrer sur des cas confirmés de fusion
    # Second signal, INDÉPENDANT de l'historique de largeur : deux jeux de
    # points-clés de tête confiants et séparés de plus de 0,4 × largeur de boîte
    # dans UNE SEULE boîte valent fusion, dès la première frame. Lève l'angle
    # mort du signal par largeur : deux personnes assises côte à côte dès la
    # première frame ne produisent jamais celui-ci, leur largeur fusionnée étant
    # la référence. Sans effet tant que `presence.head_assist.enabled` est faux
    # (les points-clés proviennent du modèle pose) : le signal par largeur reste
    # alors seul actif, comportement inchangé.
    head_separation_ratio: 0.4  # PROVISOIRE — à calibrer sur des cas confirmés de fusion

anchor:
  height_history_window_frames: 30      # fenêtre pour estimer la hauteur "normale" de la piste
  max_height_drop_ratio: 0.35           # chute relative de hauteur considérée comme anormale
  height_drop_confirm_frames: 3         # nombre de frames pour confirmer une chute réelle vs bruit


timing:
  # Toutes les durées sont en SECONDES ; elles sont converties en frames au
  # runtime avec le FPS réellement mesuré (règle 0.2).
  fps_source: measured          # jamais une valeur supposée
  # time_base — NOUVEAU (lot 1, §1.0). Valeur précédente : aucune ; le pipeline
  # horodatait systématiquement sur time.perf_counter (temps MURAL), y compris
  # sur fichier.
  #   raison : sur fichier, le temps mural fait dépendre toutes les durées de la
  #     vitesse de la machine. Mesuré en session 0 sur fort_occ4 : 13 purges en
  #     base vidéo contre 0 en base murale, et un bruit run-à-run nul d'un côté,
  #     non nul de l'autre (docs/correctif_occlusion.md §11.7.3). Une mesure
  #     faite sur fichier décrivait donc un régime qui n'existe pas en
  #     production.
  #   compromis accepté : sur fichier, les durées ne reflètent plus le temps
  #     réellement passé à traiter ; c'est voulu — c'est le temps de la SCÈNE qui
  #     gouverne une occlusion, pas celui du calcul. Le FPS de traitement reste
  #     mesuré et publié à part.
  #   auto = vidéo si la source est un fichier, mural si c'est une caméra.
  time_base: auto
  # Warm-up : terminé quand warmup_min_frames frames ONT été observées ET que
  # warmup_seconds se sont écoulées. Exiger les deux bornes évite une fin
  # prématurée à faible FPS (temps écoulé mais 3 frames vues) comme à haut FPS
  # (15 frames vues en 0,15 s).
  warmup_seconds: 0.5
  warmup_min_frames: 15
  # Lot 4 : second garde-fou reporté depuis tracker.new_track_thresh (0,7 -> 0,45) :
  # une piste créée à tort doit tenir 0,5 s avant tout franchissement. Valeur
  # inchangée, voir docs/correctif_occlusion.md §15.
  confirmation_seconds: 0.5
  grace_period_seconds: 5.0
  fps_estimate_window: 30       # frames pour la moyenne glissante du FPS

occupancy:
  in_progress_disappearance_policy: deferred_confirmation
  snapshot_interval_seconds: 1.0
  in_progress_policy: [deferred_confirmation, ambiguous_on_expiry]

output:
  session_root: results         # jamais le répertoire courant (6.4)
  events_filename: events.jsonl
  video_filename: annotated.mp4
  write_mode: append_incremental
  flush_every_n_events: 1
  write_video: false
  annotated_video_codec: mp4v

stabilization:
  # Verrouillage de hauteur des bounding boxes : ACTIF dans le pipeline officiel.
  # Sans lui, une chute brutale de hauteur (jambes masquées, personne assise,
  # flou) fait remonter le bas de boîte, donc l'ancre pieds : le calcul de zone
  # dans geometry.py voit une fausse transition. Le profil de hauteur est indexé
  # par person_id (stable), jamais par l'identifiant technique de BoT-SORT, et il
  # survit donc à une occultation / un changement d'identifiant technique.
  # La boîte brute et la raison de la correction restent journalisées (spec 7) et
  # la chute anormale est signalée en ANCHOR_UNRELIABLE (prioritaire sur tout
  # changement de zone dans la FSM).
  use_bbox_locker: true
  bbox_locker_min_height_ratio: 0.70   # PROVISOIRE — à calibrer sur l'ensemble de calibration
  use_anchor_stabilizer: false
  anchor_stabilizer_tolerance_ratio: 0.15  # fraction de la hauteur médiane

display:
  enabled: true                 # false = mode headless réel
  window_name: People counting

logging:
  level: INFO
  print_state_transitions: false

diagnostics:
  # Diagnostics de détection / d'association (perte de piste, identifiant
  # technique absent, détections faibles). Journalisés dans events.jsonl, avec
  # limitation de débit pour ne pas noyer les événements métier : le front
  # montant est toujours écrit, puis au plus un événement par intervalle.
  enabled: true
  min_interval_seconds: 1.0

# -- Assistance par détection de tête (additif, désactivé par défaut) ------
# Utilise yolo11s-pose.pt (17 points-clés COCO) pour maintenir la présence
# d'une personne dont les pieds sont occultés (tables, chaises). Le point
# tête ne participe JAMAIS au calcul de franchissement de ligne.
presence:
  head_assist:
    enabled: false                       # additif, désactivé par défaut
    pose_model_path: models/yolo11s-pose.pt
    pose_model_expected_sha256: null      # à renseigner une fois le poids téléchargé
    min_keypoint_confidence: 0.5          # PROVISOIRE — à calibrer
    # 5 points-clés — ÉTAIENT 3 (nez + les deux yeux), alors que le rapport
    # §4.7 en annonçait 5. Les oreilles sont précisément les points qui
    # survivent à une vue de profil : sans elles, une personne de trois quarts
    # tournée n'a plus de point tête fiable et l'assistance retombe en
    # « tête non confiante » comme si la tête était invisible.
    keypoints_used: [nose, left_eye, right_eye, left_ear, right_ear]
    max_presence_extension_seconds: 10.0  # PROVISOIRE — borne de sécurité
    # Écart maximal (frames) entre la frame courante et celle où le point tête a
    # été observé, pour autoriser un maintien de présence dans _handle_missing.
    # 1 = la frame courante ou la précédente. Sans cette borne, la piste relisait
    # un point tête figé lors de la dernière frame OBSERVÉE (les keypoints sont
    # extraits de la même détection que la boîte : pas de boîte, pas de point) et
    # pouvait maintenir jusqu'à 10 s une personne réellement sortie du champ.
    max_head_staleness_frames: 1
