[pytest]
# Suite complète en une seule commande, avec rapport de couverture du cœur
# métier (livrable 6) :
#
#     python -m pytest
#
# `src/main.py` est la boucle d'entrée/sortie (caméra, écriture vidéo) : elle est
# exercée de bout en bout par `tests/test_main_units.py` et par le protocole
# d'évaluation, mais son exécution complète exige une source vidéo. Sa couverture
# n'est donc pas un indicateur utile ici ; le seuil porte sur les modules métier.
testpaths = tests
addopts =
    -q
    -ra
    --cov=src
    --cov-report=term-missing:skip-covered
    --cov-fail-under=85
markers =
    slow: test long (modèle chargé, sous-processus)
