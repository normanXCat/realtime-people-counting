tracker_type: botsort

# Favoriser la récupération d’une piste existante pendant une occultation.
track_high_thresh: 0.25
track_low_thresh: 0.05
new_track_thresh: 0.30
track_buffer: 180
match_thresh: 0.80
fuse_score: True

# Ré-identification native BoT-SORT.
with_reid: True
model: auto
proximity_thresh: 0.20
appearance_thresh: 0.80

# Caméra fixe : éviter d’injecter un mouvement global artificiel.
gmc_method: none
