# Configuration BoT-SORT lue directement par Ultralytics.
#
# TOUTES les valeurs ci-dessous sont DOUBLÉES dans config/pipeline.yaml (section
# `tracker`) : le pipeline les valide, les publie et journalise leur cohérence
# avec le seuil d'inférence YOLO. Un test vérifie que les deux sources ne
# divergent pas — une divergence serait sinon totalement silencieuse.
#
# track_low_thresh reste volontairement bas (0.1) : c'est lui qui conserve les
# détections faibles (personne floue) pour le second étage d'association.
# Le garde-fou contre les faux positifs n'est PLUS porté ici : depuis le passage
# de new_track_thresh à 0.45 (voir ci-dessous), il est reporté explicitement sur
#   - le filtre géométrique `geometry` de pipeline.yaml
#     (min_aspect_ratio_wh, max_aspect_ratio_wh, min_box_height_px,
#      min_box_width_px), qui élimine les artefacts verticaux et les crops
#     minuscules, et
#   - `timing.confirmation_seconds`, qui empêche une apparition intérieure
#     instable d'être confirmée (`NEW`) avant d'avoir tenu.
# Ce report est volontaire : un seuil de création élevé refusait aussi toute
# personne assise détectée à 0.35–0.6 de confiance, qui ne pouvait donc jamais
# obtenir d'identifiant (symptôme « personne jamais ré-attribuée »).
#
# track_buffer (150 frames ≈ 5 s à 30 ips) couvre le p90 des occlusions mesurées
# sur les vidéos de test (médiane 2,5 s, p90 5,1 s, maximum 13,5 s) ; au-delà, la
# galerie ReID long terme prend le relais. ATTENTION : track_buffer est exprimé
# en FRAMES alors que la galerie ReID l'est en SECONDES ; à faible FPS traité
# (caméra live), 150 frames couvrent une durée réelle très supérieure à 5 s.
# with_reid active l'apparence native de BoT-SORT en complément du ReID long
# terme de IdentityManager.
tracker_type: botsort

# Association et conservation des pistes pendant les occultations.
track_high_thresh: 0.4
track_low_thresh: 0.1
# new_track_thresh 0.7 -> 0.45 (PROVISOIRE). Raison : une personne assise
# partiellement masquée produit une détection à 0.35–0.6 ; avec 0.7 elle était
# détectée mais ne pouvait jamais créer de piste après expiration de
# track_buffer. Compromis accepté : davantage de pistes créées à partir de
# détections faibles ; le rejet des faux positifs est reporté sur le filtre
# géométrique et sur timing.confirmation_seconds (voir l'en-tête).
new_track_thresh: 0.45
track_buffer: 150
# match_thresh 0.9 -> 0.75 (PROVISOIRE). Dans Ultralytics, match_thresh est un
# seuil de COÛT (linear_assignment(dists, thresh=match_thresh) avec
# dists = 1 - IoU) : à 0.9 le tracker acceptait un appariement à IoU 0.1, ce qui
# autorisait l'appariement croisé de deux personnes voisines. Compromis : sous
# 0.75, une piste en mouvement rapide peut être perdue plus tôt et suivre le
# chemin de réassociation (galerie) plutôt que l'association IoU.
match_thresh: 0.75
fuse_score: True

# Re-identification native BoT-SORT.
with_reid: True
model: auto
# proximity_thresh 0.5 -> 0.8 (PROVISOIRE). Dans BOTrack.get_dists,
# dists_mask = ious_dist > proximity_thresh puis emb_dists[dists_mask] = 1.0 :
# l'apparence n'était consultée que si l'IoU était déjà >= 0.5. Une personne qui
# ressort d'une occlusion a un IoU quasi nul avec sa boîte prédite, donc le ReID
# natif était neutralisé exactement quand il servirait. Compromis accepté : le
# descripteur d'apparence est consulté presque toujours, ce qui augmente le coût
# de calcul et le risque de réassociation d'apparences similaires (voir
# reid.long_term.descriptor.similarity_threshold).
proximity_thresh: 0.8
appearance_thresh: 0.25

# Caméra fixe.
gmc_method: none
