# Configuration BoT-SORT lue directement par Ultralytics.
#
# TOUTES les valeurs ci-dessous sont DOUBLÉES dans config/pipeline.yaml (section
# `tracker`) : le pipeline les valide, les publie et journalise leur cohérence
# avec le seuil d'inférence YOLO. Un test vérifie que les deux sources ne
# divergent pas — une divergence serait sinon totalement silencieuse.
#
# track_low_thresh reste volontairement bas (0.1) : c'est lui qui conserve les
# détections faibles (personne floue) pour le second étage d'association. Le
# garde-fou contre les faux positifs n'est pas le seuil d'inférence YOLO
# (model.confidence = 0.10 dans pipeline.yaml). new_track_thresh le portait à
# 0.7 ; abaissé à 0.45 au lot 4 (PROVISOIRE), le garde-fou est reporté sur le
# filtre géométrique et timing.confirmation_seconds de pipeline.yaml, où figurent
# la valeur précédente, la mesure et le compromis.
#
# track_buffer (150 frames ≈ 5 s à 30 ips) couvre le p90 des occlusions mesurées
# sur les vidéos de test (médiane 2,5 s, p90 5,1 s) ; au-delà, la galerie ReID
# long terme prend le relais. with_reid active l'apparence native de BoT-SORT en
# complément du ReID long terme de IdentityManager.
tracker_type: botsort

# Association et conservation des pistes pendant les occlusions.
track_high_thresh: 0.4
track_low_thresh: 0.1
new_track_thresh: 0.45   # lot 4, PROVISOIRE — valeur précédente 0.7
track_buffer: 150
match_thresh: 0.9
fuse_score: True

# Re-identification native BoT-SORT.
with_reid: True
model: auto
proximity_thresh: 0.5
appearance_thresh: 0.25

# Caméra fixe.
gmc_method: none
