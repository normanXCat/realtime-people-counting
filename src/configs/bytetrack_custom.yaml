tracker_type: bytetrack
# Première passe : seuil abaissé pour conserver les personnes partiellement masquées.
track_high_thresh: 0.30
# Seconde passe : récupère les détections faibles sans autoriser les scores nuls.
track_low_thresh: 0.08
# Seuil d'initialisation inférieur au seuil de confiance YOLO pour limiter la fragmentation.
new_track_thresh: 0.30
# Persistance d’une piste perdue (~5 s à 30 FPS), alignée sur --max-age.
track_buffer: 150
# Association IoU modérée : évite les fusions de personnes proches.
match_thresh: 0.75
fuse_score: True
