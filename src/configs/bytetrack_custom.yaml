tracker_type: bytetrack
# Première passe : seuil abaissé pour conserver les personnes avant/après occlusion.
track_high_thresh: 0.25
# Seconde passe ByteTrack : récupère les détections faibles jusqu’à ce seuil.
track_low_thresh: 0.05
# Initialisation plus tolérante, afin d’éviter une nouvelle piste après une détection affaiblie.
new_track_thresh: 0.25
# Mémoire de 180 frames (~6 secondes à 30 FPS).
track_buffer: 180
# Association modérée; la ré-identification hybride prend le relais en cas d’ambiguïté.
match_thresh: 0.75
fuse_score: True
