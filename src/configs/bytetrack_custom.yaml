tracker_type: bytetrack
# Première passe tolérante pour conserver les personnes avant une perte brève.
track_high_thresh: 0.25
# Seconde passe low-confidence pour réassocier les détections faibles.
track_low_thresh: 0.05
# Évite de créer une piste neuve après une baisse momentanée de confiance.
new_track_thresh: 0.25
# État Lost conservé 120 frames (~4 secondes à 30 FPS).
track_buffer: 120
# Matching légèrement assoupli pour les pistes Lost, sans rendre l’association permissive.
match_thresh: 0.70
fuse_score: True
